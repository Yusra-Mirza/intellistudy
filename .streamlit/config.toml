[theme]
base = "light"
primaryColor = "#C2410C"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#F3EFE6"
textColor = "#1C1917"
font = "sans serif"

[server]
fileWatcherType = "auto"
headless = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[client]
showErrorDetails = true
toolbarMode = "minimal"
